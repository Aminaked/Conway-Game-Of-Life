<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Conway's Game of Life</title>
</head>

<body>
    <h1> Conway's Game Of Life</h1>
    <div class="game-body">
        <canvas id="gridCanvas"></canvas>
        <div class="controls">
            <button id="startBtn">Start/Stop</button>
            <button id="clearBtn">Clear</button>
            <button id="randomBtn">Random</button>
            <button id="gliderGunBtn">Glider Gun</button>
            <button id="pulsarBtn">Pulsar</button>
            <button id="pentaDecathlonBtn">PentaDecathlon</button>
            <button id="LightweightSpaceshipBtn">Lightweight Spaceship</button>

        </div>
        
    </div>

    <script src="app.js"> </script>
</body>

</html>
